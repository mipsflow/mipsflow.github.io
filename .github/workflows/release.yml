name: Release

# Pushing a version tag (for example v1.0.0) publishes a GitHub release for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "MIPSflow $TAG" --notes "סימולטור MIPS אינטראקטיבי בעברית: מעבד חד־מחזורי, צינור בן 5 שלבים, סיכונים, forwarding ובועות, ומעקב אחרי קוד שלך.

          לאתר: https://mipsflow.github.io/
          משוב והצעות: https://tally.so/r/VpQ1Ra"
