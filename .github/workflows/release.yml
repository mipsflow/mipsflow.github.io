name: Release

# Changing the VERSION file on main publishes a GitHub release (tag vX.Y.Z) for it.
on:
  push:
    branches: [main]
    paths: ['VERSION']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already exists"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MIPSflow $TAG" --notes "סימולטור MIPS אינטראקטיבי בעברית: מעבד חד־מחזורי, צינור בן 5 שלבים, סיכונים, forwarding ובועות, ומעקב אחרי קוד שלך.

          לאתר: https://mipsflow.github.io/
          משוב והצעות: https://tally.so/r/VpQ1Ra"
